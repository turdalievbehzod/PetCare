<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<section style="margin-top: 120px;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card p-4 shadow-sm">

          <h3 class="text-center mb-3">Verify Code</h3>

          <p class="text-center text-muted mb-4">
            Enter the code sent to your phone
          </p>

          <form id="verifyForm">

            <div class="form-group mb-3">
              <input type="text" name="code" class="form-control" placeholder="Enter code" required>
            </div>

            <button type="submit" class="btn header-btn w-100">
              Verify
            </button>

          </form>

          <p class="text-center mt-3">
            Didn't receive code?
            <a href="#" id="resendBtn">Resend</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("verifyForm");
  const resendBtn = document.getElementById("resendBtn");

  const phone = localStorage.getItem("phone_number");

  if (!phone) {
    alert("No phone number found. Please register again.");
    window.location.href = "register.html";
    return;
  }

  function showError(msg) {
    alert(msg);
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const code = form.code.value.trim();

    if (!code) {
      showError("Enter verification code");
      return;
    }

    try {
      const response = await fetch("http://127.0.0.1:8000/api/v1/users/verify/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          phone_number: phone,
          code: code
        })
      });

      const result = await response.json();

      if (response.ok) {
        alert("Account verified!");

        localStorage.removeItem("phone_number");

        window.location.href = "login.html";
      } else {
        showError(result.message || JSON.stringify(result.errors));
      }

    } catch (err) {
      showError("Server error");
    }
  });

  resendBtn.addEventListener("click", async function (e) {
    e.preventDefault();

    try {
      const response = await fetch("http://127.0.0.1:8000/api/v1/users/resend-code/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          phone_number: phone
        })
      });

      if (response.ok) {
        alert("Code resent!");
      } else {
        alert("Failed to resend code");
      }

    } catch (err) {
      alert("Server error");
    }
  });

});
</script>

</body>
</html>
